name: ci

on:
  push:
    branches: [main, "m*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  # Lint, type-check, unit tests, reviewer suites, licence gates and MCP conformance, on both product platforms.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # C1.3: the workspace tests took 17-20 min of the former 30-min budget on 2026-10-26 (run 40419016272).
    # C1.4: on Windows they took 32.7 min and the job hit 45 min in the release build that follows (run 41003361353,
    # every step green until the cancellation); the race, liveness and measurement suites and the SDK step need 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the reviewer policy suite (tests/adversarial/c11-r2-review-policy.py) diffs against the
          # round-1 review commit.
          fetch-depth: 0

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal --component rustfmt,clippy
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Front end — lint, type-check, test, format, licences
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm format:check
          pnpm licenses:check

      - name: Reviewer Python suites (every tests/adversarial/*.py)
        run: |
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          $PY scripts/run-reviewer-python-suites.py
          # Reviewer-owned C2.4 files differ only by the ruled, declared edits (M2 C2.4 round 2, edit 57).
          $PY scripts/check-reviewer-ownership.py

      - name: Front end — build, diagnostics variant then default (frontendDist is embedded by the Tauri host)
        run: |
          # Both variants must pass the IPC boundary dist check; the default one stays in dist for the Rust steps.
          pnpm --dir desktop build:diagnostics
          pnpm --dir desktop build

      - run: cargo fmt --all --check

      - name: Generated command declarations are current (C12-R1-12)
        run: |
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          PYTHONIOENCODING=utf-8 $PY scripts/gen-command-declarations.py
          git diff --exit-code -- crates/registry/src/declared.rs crates/registry/src/declared.json plan/spec-issues.md

      # Product code (libraries, binaries, examples) is linted with every warning denied. All targets, tests included,
      # likewise except one style lint: the reviewer-owned `c24_r4_closure.rs` has blank lines after doc comments, and
      # reviewer-owned files are not edited (M2 merge candidate, declared CI edit; drop the `-A` once that file is fixed).
      - run: |
          cargo clippy --workspace --lib --bins --examples --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::empty_line_after_doc_comments
      # The six 10 000-operation history oracles (C1.2-C1.4) run in release in `history-oracles` (moved in M2 C2.3 round 1:
      # Windows `check` reached 55 min 02 s in run 41320596822); everything else in their binaries runs here. The seeded
      # topology properties (C24-R1-01: 256 cases each) run in `check-properties` (split in M2 C2.4 round 1: Windows
      # `check` reached its 60-minute limit in run 41475164426); the rest of their binaries runs here too.
      - name: Run cargo test --workspace --locked
        run: |
          cargo test --workspace --locked -- --skip ten_thousand_history_operations_match_independent_content_oracle_and_replay \
            --skip stroke_add_matches_the_oracle \
            --skip stroke_set_and_delete_match_the_oracle \
            --skip segment_cut_matches_the_oracle \
            --skip region_erase_matches_the_oracle \
            --skip flatten_of_overlapping_layers_matches_the_oracle \
            --skip optimize_and_smooth_keep_the_oracles_partition \
            --skip transforms_match_the_oracles_transformed_geometry \
            --skip affine_envelopes_match_the_oracle \
            --skip point_moves_with_and_without_snapping_match_the_oracle \
            --skip lines_to_brush_and_centre_line_keep_the_oracles_partition \
            --skip break_apart_leaves_the_line_layer_to_the_oracle \
            --skip transforms_with_determinant_plus_and_minus_one_keep_the_oracles_faces \
            --skip the_cutter_splits_along_its_segment_like_the_oracle \
            --skip flatten_of_disjoint_layers_has_the_faces_of_their_union \
            --skip vectorized_shapes_enclose_one_unpainted_zone_per_paper_component \
            --skip shrunk_cutter_area_bound \
            --skip zones_are_the_oracles_bounded_faces_on_degenerate_arrangements \
            --skip determinant_plus_and_minus_one_maps_keep_the_faces \
            --skip zone_ids_and_areas_do_not_depend_on_stroke_order_and_settling_is_idempotent \
            --skip adding_strokes_carries_each_fill_into_the_zones_it_splits \
            --skip side_fills_read_back_after_adding_strokes \
            --skip a_settled_layer_is_a_fixpoint_of_noding \
            --skip lines_to_brush_then_centre_line_on_closed_loops \
            --skip centre_line_of_a_spineless_ring \
            --skip break_apart_matches_the_fonts_glyph_outlines \
            --skip vectorize_masks_enclose_the_predicted_paper_components \
            --skip smooth_changes_the_shape_within_its_tolerance \
            --skip erasing_polygonal_brushes_keeps_partly_covered_ones_whole \
            --skip flatten_of_pencil_and_polygonal_brush_layers_is_exact \
            --skip non_parallelogram_envelopes_map_the_layer_projectively \
            --skip snapping_onto_a_curved_contour_reaches_its_nearest_point \
            --skip integer_translations_and_compositions_preserve_all_snapped_anchor_sequences \
            --skip side_fills_read_back_beside_collinear_overlaps

      - name: Desktop host with the M0 diagnostics feature (C0.4 gating) — clippy and tests
        run: |
          cargo clippy -p tt-desktop --all-targets --locked --features m0-diagnostics -- -D warnings
          cargo test -p tt-desktop --locked --features m0-diagnostics

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # ADR-0003 rule 7: test-only assets (the OFL fixture font) are listed with their licences and named by no product
      # source; the bundle job scans the built products for them.
      - name: Test-only assets stay out of the product
        run: python scripts/check-test-only-assets.py || python3 scripts/check-test-only-assets.py
      # C24-R1-03: the C22-T2 gate rejects malformed timing evidence (exit 2, nothing written).
      - name: C22-T2 gate analyser rejects malformed evidence
        run: python scripts/test_c22_t2_gate.py || python3 scripts/test_c22_t2_gate.py

      - name: MCP protocol conformance with the official Python SDK client (C1.4; 11 §14.7), measurements
        run: |
          # The release build, self-test and linked-library proof run in the `headless` job (M2 C2.1 CI change: the
          # check budget must not depend on a warm cache). Here the SDK client drives the debug binary the test steps
          # above already compiled, so check keeps its C1.4 protocol coverage on both OSes.
          cargo build --locked -p tt-headless
          exe=target/debug/toontown-headless
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; PY=python; fi
          mkdir -p out
          # A virtual environment: system Pythons may refuse pip installs (PEP 668).
          $PY -m venv .venv-mcp
          VPY=.venv-mcp/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv-mcp/Scripts/python.exe; fi
          $VPY -m pip install --quiet "mcp==2.0.0"
          PYTHONIOENCODING=utf-8 $VPY scripts/mcp-conformance.py "$exe" out/sdk-conformance.json
          # The C1.4 measurements written by the test suite (lock liveness, cache, fingerprint, autosave, never-block),
          # recomputed from their observations (C14-R1-07), and the release-feature proof (C14-R1-10).
          $PY scripts/analyse-measurements.py target/evidence/c14 --out out/measurement-analysis.json
          cp -r target/evidence/c14 out/c14-measurements
          # The C2.3 drawing renders as this platform produced them, with their hash manifest (C23-R1).
          cp -r target/evidence/c23-render out/c23-render
          $PY scripts/check-release-features.py > out/release-features.log || { cat out/release-features.log; exit 1; }
          cat out/release-features.log

      - uses: actions/upload-artifact@v7
        with:
          name: check-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # The headless release binary on both product platforms (moved out of `check` in M2 C2.1: on a cold cache the
  # release build pushed `check` past its 60-minute budget, run 41105899189 on main). Its own budget, so neither job's
  # time depends on cache warmth.
  # The seeded topology properties against the independent oracle (C24-R1-01), 256 cases each in the same debug build as
  # `check`: the command routes, the reviewer's round-1 variants and the C2.4 vector properties. A job of its own so
  # `check` stays inside its budget (CI rule: add jobs, not minutes).
  check-properties:
    name: check properties (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-properties

      - name: Seeded topology properties (256 cases each)
        run: |
          cargo test --locked -p tt-executor --test c24_oracle_routes --test c24_route_domains --test c24_r1_topology --test c24_topology
          cargo test --locked -p tt-vector --test c24_r1_properties --test c24_properties

  # The reviewer's round-2 and round-3 seed variants (C2.4 rounds 2 and 3): the route properties with seeds XOR 0x5D (256 cases), the
  # topology and vector properties at the 4096 cases their files fix, the closed-fold noding controls. Release, in a job
  # of their own (CI rule: add jobs, not minutes; `check properties` was at 31 of its 45 minutes on Windows).
  review-properties:
    name: review properties release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: review-properties

      - name: Reviewer round-2 seed variants
        run: |
          cargo test --release --locked -p tt-executor --test c24_r2_routes --test c24_r2_topology --test c24_r2_variants
          cargo test --release --locked -p tt-vector --test c24_r2_properties --test c24_r2_noding
          # Round 3 (C2.4): the route domains and routes with seeds XOR 0xD3 (256 cases), topology at the 4096 cases its
          # file fixes, the vector properties and the noding control.
          cargo test --release --locked -p tt-executor --test c24_r3_domains --test c24_r3_routes --test c24_r3_topology
          # Round-4 closure (C2.4): its two seeded properties share names with `check`'s skip list, so they run here.
          cargo test --release --locked -p tt-executor --test c24_r4_closure
          cargo test --release --locked -p tt-vector --test c24_r3_properties --test c24_r3_noding

  headless:
    name: headless release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-release

      - name: Headless binary — build, self-test (twice, compared), linked-library proof
        run: |
          cargo build --release --locked -p tt-headless
          exe=target/release/toontown-headless
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; PY=python; fi
          "$exe" --version
          env -u DISPLAY -u WAYLAND_DISPLAY "$exe" --selftest
          "$exe" --selftest --json > selftest-1.json
          "$exe" --selftest --json > selftest-2.json
          # Everything except timing must be identical between runs (determinism, ADR-0004).
          $PY -c "import json,sys; strip=lambda f:[(c['id'],c['ok']) for c in json.load(open(f))['checks']]; a,b=strip('selftest-1.json'),strip('selftest-2.json'); print(a); sys.exit(0 if a==b and all(ok for _,ok in a) else 1)"
          $PY scripts/check-headless-deps.py "$exe"
          mkdir -p out && cp "$exe" selftest-1.json out/

      - name: 100k-stroke drawing measurements and geometry history oracles (M2 C2.1 obligation 4; release)
        run: |
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          os=$(echo "$RUNNER_OS" | tr "[:upper:]" "[:lower:]")
          # One run identity for every measurement of this job, checked by the C22-T2 gate (C24-R2-03).
          export TT_MEASURE_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$os"
          export TT_EXPECT_RUN_ID="$TT_MEASURE_RUN_ID"
          cargo test --release --locked -p tt-executor --test c21_measurements -- --ignored --nocapture
          # Both seeded 10 000-operation history oracles with drawing geometry on a saved/reopened fixture (MCP).
          cargo test --release --locked -p tt-mcp --test c21_history -- --ignored --nocapture
          # The C1.2-C1.4 10 000-operation history oracles run in `history-oracles` (split out in M2 C2.3 round 3).
          # Worst-case fitting work on the adversarial 100 000-sample corpus (C21-R1-06; every run kept).
          cargo test --release --locked -p tt-vector --test c21_worst_case -- --ignored --nocapture
          # Worst-case planar-map work on the adversarial layer corpus (M2 C2.2 readiness items 3 and 9; every run kept).
          cargo test --release --locked -p tt-vector --test c22_worst_case -- --ignored --nocapture
          # The C22-T2 gate (M2 C2.4 ruling): 100k Flatten, five budgeted and five unbudgeted repetitions (dev-only hook
          # lifts the budget), against this run's 100k strokeAdd p50.
          TT_MEASURE=1 cargo test --release --locked -p tt-executor --features test-hooks --test c24_measure -- --ignored --nocapture
          # Where the merged layer's settling time goes (C22-T2 bounded pass: the noding an incremental pass could skip).
          TT_MEASURE=1 cargo test --release --locked -p tt-vector --test c24_flatten_phases -- --ignored --nocapture
          mkdir -p out
          $PY scripts/c22-t2-gate.py target/evidence/c21/strokes-100k-$os.json target/evidence/c24/flatten-100k-$os.json out/c22-t2-gate.json
          cp -r target/evidence/c24 out/c24-measurements
          cp -r target/evidence/c21-fit out/c21-fit-worst-case
          cp -r target/evidence/c22-planar out/c22-planar-worst-case
          $PY scripts/analyse-measurements.py target/evidence/c21 --out out/c21-measurement-analysis.json
          cp -r target/evidence/c21 out/c21-measurements

      - name: MCP protocol conformance of the release binary (official Python SDK client)
        run: |
          exe=target/release/toontown-headless
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; PY=python; fi
          $PY -m venv .venv-mcp
          VPY=.venv-mcp/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv-mcp/Scripts/python.exe; fi
          $VPY -m pip install --quiet "mcp==2.0.0"
          PYTHONIOENCODING=utf-8 $VPY scripts/mcp-conformance.py "$exe" out/sdk-conformance.json

      - uses: actions/upload-artifact@v7
        with:
          name: headless-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # The six C1.2-C1.4 10 000-operation history oracles in release (moved from `check` in M2 C2.3 round 1, split out of
  # `headless` in round 3: Windows `headless` passed its 55-minute budget in run 41363091264). Same assertions; each
  # oracle's output is kept as an artifact.
  history-oracles:
    name: history oracles release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: history-oracles

      - name: C1.2-C1.4 10 000-operation history oracles (release; executor and MCP)
        run: |
          mkdir -p out
          cargo test --release --locked -p tt-executor --test c12_r1_stress --test c12_r3_stress --test c13_r3_history_r1 --test c13_r3_history_r3 -- ten_thousand_history_operations_match_independent_content_oracle_and_replay --exact --nocapture 2>&1 | tee out/history-oracles-executor.log
          cargo test --release --locked -p tt-mcp --test c14_r3_history_r1 --test c14_r3_history_r3 -- ten_thousand_history_operations_match_independent_content_oracle_and_replay --exact --nocapture 2>&1 | tee out/history-oracles-mcp.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: history-oracles-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # M2 C2.4 readiness items 8 and 9 (R1-12 budget baselines; large aggregates in the queue/cancellation corpus), in
  # release, raw observations kept as artifacts. A job of its own so `headless` stays inside its budget (CI rule: add
  # jobs, not minutes).
  measurements:
    name: measurements release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: measurements

      - name: R1-12 baselines (memory, queued reads, maintenance) and large aggregates (Break Apart 100k, 8192 render)
        run: |
          mkdir -p out
          status=0
          TT_MEASURE=1 cargo test --release --locked --no-fail-fast -p tt-executor --test c24_budgets --test c24_aggregate -- --ignored --nocapture || status=1
          # The raw observations are kept even when an assertion fails.
          cp -r target/evidence/c24 out/c24-measurements || true
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # End-to-end scenario E2 (paint by id, 11 §14.8; M2 C2.4 readiness item 3) through the official Python SDK against the
  # release binary: vectorize, validate, paint by ID, recolour, render, undo/redo, save/open, `--run` replay from the
  # saved base. The seven PNGs and their hashes are kept as artifacts.
  e2:
    name: e2 release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-release

      - name: E2 paint by id (official Python SDK, release binary)
        run: |
          cargo build --release --locked -p tt-headless
          exe=target/release/toontown-headless
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; PY=python; fi
          $PY -m venv .venv-e2
          VPY=.venv-e2/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv-e2/Scripts/python.exe; fi
          $VPY -m pip install --quiet "mcp==2.0.0"
          PYTHONIOENCODING=utf-8 $VPY scripts/e2-paint-by-id.py "$exe" out/e2

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2-${{ runner.os }}
          path: out/e2/
          if-no-files-found: error

  # Unsigned desktop bundles + automated IPC round-trip benchmark in the real webview.
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # C0.4: the default build carries no M0 diagnostics. It is built and checked first and kept in default-build/;
      # the diagnostics build (tauri.diagnostics.conf.json) then runs the measurements and is the manual-test artifact.
      - name: Tauri build, default (unsigned; no M0 diagnostics)
        run: pnpm --dir desktop tauri build --bundles ${{ matrix.bundles }} -- --locked

      - name: The default build carries no test-only asset (ADR-0003 rule 7)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY scripts/check-test-only-assets.py --bundle target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then $PY scripts/check-test-only-assets.py --bundle target/release/toontown.exe; fi

      - name: Default build registers no M0 diagnostic command and refuses the flags
        run: |
          mkdir -p out/default-build
          if [ "$RUNNER_OS" = "Windows" ]; then
            app=target/release/toontown.exe; PY=python
            cp target/release/bundle/nsis/*.exe target/release/toontown.exe out/default-build/
          else
            app=target/release/bundle/macos/Toontown.app/Contents/MacOS/toontown; PY=python3
            tar -czf out/default-build/Toontown-macos-arm64.app.tar.gz -C target/release/bundle/macos Toontown.app
          fi
          $PY scripts/check-diagnostics-gating.py "$app" --expect default
          for flag in "--ipc-bench $PWD/refused.json" "--spike canvas"; do
            if "$app" $flag 2> refusal.txt; then echo "default build accepted $flag"; exit 1; fi
            cat refusal.txt
            grep -q "is an M0 diagnostic and this build has none" refusal.txt
          done
          test ! -e refused.json

      - name: Tauri build with M0 diagnostics (unsigned; for the measurements below and the manual tests)
        run: |
          pnpm --dir desktop tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.diagnostics.conf.json -- --locked
          if [ "$RUNNER_OS" = "Windows" ]; then app=target/release/toontown.exe; PY=python; else
            app=target/release/bundle/macos/Toontown.app/Contents/MacOS/toontown; PY=python3; fi
          $PY scripts/check-diagnostics-gating.py "$app" --expect diagnostics

      - name: IPC benchmark in the real webview (toontown --ipc-bench)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            app=target/release/toontown.exe; PY=python
          else
            app=target/release/bundle/macos/Toontown.app/Contents/MacOS/toontown; PY=python3
          fi
          "$app" --ipc-bench "$PWD/ipc-bench.json" --ipc-bench-count 300
          cat ipc-bench.json
          $PY -c "import json,sys; r=json.load(open('ipc-bench.json')); sys.exit(0 if r.get('frontend',{}).get('ok') else 1)"

      - name: C0.2 tablet spike with synthetic pen input (Windows runner; non-blocking measurement)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          target/release/toontown.exe --spike tablet --spike-log "$PWD/tablet-spike-windows.json" --spike-auto
          python -c "import json; r=json.load(open('tablet-spike-windows.json')); [print(m['message']) for m in r['statusLog']]"
          # Everything below is recomputed from the raw samples (the log's own summaries are not used).
          PYTHONIOENCODING=utf-8 python scripts/analyse-tablet-log.py tablet-spike-windows.json --json tablet-spike-windows.analysis.json

      - name: C0.3 canvas spike (render list -> WebGPU/WebGL2; non-blocking measurement on the CI runner)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then app=target/release/toontown.exe; PY=python; else
            app=target/release/bundle/macos/Toontown.app/Contents/MacOS/toontown; PY=python3; fi
          "$app" --spike canvas --spike-log "$PWD/canvas-spike-$RUNNER_OS.json" --spike-auto
          # Every number below is recomputed from the raw samples in the log.
          PYTHONIOENCODING=utf-8 $PY scripts/analyse-canvas-log.py "canvas-spike-$RUNNER_OS.json"             --json "canvas-spike-$RUNNER_OS.analysis.json"

      - name: Collect artifacts
        run: |
          # out/default-build/ already holds the default build; the rest is the M0 diagnostics build.
          mkdir -p out
          cp ipc-bench.json out/
          # The manual tablet test (docs/manual-tests/M0-C0.2-tablet-macos.md) runs the analyzer from the artifact.
          cp scripts/analyse-tablet-log.py out/
          if [ -f tablet-spike-windows.json ]; then cp tablet-spike-windows.json out/; fi
          if [ -f tablet-spike-windows.analysis.json ]; then cp tablet-spike-windows.analysis.json out/; fi
          cp canvas-spike-*.json out/ 2>/dev/null || true
          cp scripts/analyse-canvas-log.py out/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*.exe out/
            cp target/release/toontown.exe out/
          else
            # tar keeps the executable bit and symlinks that a plain artifact zip would lose.
            tar -czf out/Toontown-macos-arm64.app.tar.gz -C target/release/bundle/macos Toontown.app
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # The strongest "no window system" evidence: Linux runners have no X/Wayland server at all.
  headless-no-display:
    name: headless without a display (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless
      - run: cargo build --release --locked -p tt-headless
      - name: Self-test with no display server
        run: |
          test -z "${DISPLAY:-}" && test -z "${WAYLAND_DISPLAY:-}"
          ! ls /tmp/.X11-unix/X* 2>/dev/null
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/toontown-headless --selftest --json > selftest-1.json
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/toontown-headless --selftest --json > selftest-2.json
          python3 -c "import json,sys; strip=lambda f:[(c['id'],c['ok']) for c in json.load(open(f))['checks']]; a,b=strip('selftest-1.json'),strip('selftest-2.json'); print(a); sys.exit(0 if a==b and all(ok for _,ok in a) else 1)"
          python3 scripts/check-headless-deps.py target/release/toontown-headless
      - name: MCP over stdio with no display server (official Python SDK client)
        run: |
          python3 -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install --quiet "mcp==2.0.0"
          env -u DISPLAY -u WAYLAND_DISPLAY .venv-mcp/bin/python scripts/mcp-conformance.py target/release/toontown-headless

  # C0.3 rasteriser determinism (spike): every fixture scene, every rasteriser configuration, must reproduce the
  # committed SHA-256 hashes on all three OSes. The job FAILS on any difference. Run twice to compare processes.
  raster:
    name: raster determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
      - uses: Swatinem/rust-cache@v2
        with:
          key: raster
      - run: cargo build --release --locked -p tt-render --example c03_raster
      - name: Render fixtures and check committed hashes (two processes)
        run: |
          set +e
          status=0
          for run in 1 2; do
            cargo run --release --locked -q -p tt-render --example c03_raster -- \
              --out "c03-raster/run$run" --report "c03-raster/report-run$run.json" \
              --check crates/render/examples/c03_raster/hashes.json || status=1
          done
          # Fixed scalar configurations against the committed hashes as a test (C03-R1-04; also run by cargo test in
          # the Windows and macOS check jobs).
          cargo test --release --locked -q -p tt-render --test c03_fixed_configurations || status=1
          # Host-raster fallback timing of the canvas-spike scenes (timing only; not hash-checked).
          cargo run --release --locked -q -p tt-render --example c03_raster -- --repeat 1             --out c03-raster/bench --report c03-raster/canvas-bench.json --canvas-bench > /dev/null || status=1
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c03-raster-${{ runner.os }}
          path: c03-raster/
