[package]
name = "tt-desktop"
description = "Toontown desktop host (Tauri 2): embeds the engine, native menu, typed IPC to the web front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tt_desktop"

[[bin]]
name = "toontown"
path = "src/main.rs"

# Reviewer's C0.3 round-2 encoder regressions (they include the spike's renderlist.rs by path), run by `cargo test`.
[[test]]
name = "c03_r2_encoder"
path = "../../tests/adversarial/c03-r2-encoder.rs"

[features]
# M0 diagnostics (--ipc-bench, --spike tablet|canvas and their commands). Off in the default build; enabled by
# tauri.diagnostics.conf.json for CI's measurement steps and the manual spike tests (C0.4).
m0-diagnostics = ["dep:tt-model"]
# Ruling D-50: dev-only delays of the gesture commit's and the scene's answers (src/delay_hooks.rs). Never in a product
# build (scripts/check-release-features.py).
# Ruling E-29 item 3 (M5 C5.1b): the watchdog's live check stops the engine on a trigger file (src/degrade_hook.rs).
test-hooks = ["dep:tt-persist", "tt-persist/test-hooks"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tt-engine.workspace = true
# M4 C4.1: the host is a client of the executor (one command entry, events, request cancellation) and serves attached
# mode over Streamable HTTP (ADR-0021, ADR-0022).
tt-executor.workspace = true
# Only with `test-hooks` (the persistence boundary hook the degrade trigger uses); never in a product build.
tt-persist = { workspace = true, optional = true }
# Only with `m0-diagnostics`: the Timeline's three-way check opens the kernel's sample document (src/timing_check.rs).
tt-model = { workspace = true, optional = true }
tt-mcp.workspace = true
# M4 C4.2b: attached screenshots are cropped and re-encoded with the renderer's PNG codec.
tt-render.workspace = true
# Native Open / Save As / folder pickers (01 §3.2, §3.6; driven from Rust only, no front-end package).
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true

# C0.2 tablet spike (desktop host only; never in engine crates, so the headless guard is unaffected).
[target.'cfg(windows)'.dependencies]
octotablet = { version = "0.1.0", default-features = false, features = ["windows-ink"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# M4 C4.2b, attached screenshots (ruling D-6): the window's own snapshot through WebView2's CapturePreview.
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }
# M4 C4.2b, attached screenshots (ruling D-6): WKWebView's snapshot, encoded as PNG.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[lints]
workspace = true
