[package]
name = "tt-vector"
description = "Toontown vector engine (see crate docs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tt-model.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# NFC of text content (10 §1.1), the same crate the model normalises with.
unicode-normalization.workspace = true
# Pure-software transcendental functions (ADR-0004 rule 3: no platform libm in persisted geometry).
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
# Boolean union of brush sweep polygons on an integer grid (deterministic; MIT OR Apache-2.0).
i_overlay = { version = "9.1.0", default-features = false }
# Font metrics for text layout and the missingFonts lint: skrifa (fontations; MIT OR Apache-2.0) parses faces,
# fontdb (MIT) lists the system fonts.
skrifa = "0.44.0"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
