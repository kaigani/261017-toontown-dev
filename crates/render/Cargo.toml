[package]
name = "tt-render"
description = "Toontown renderer (see crate docs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tt-model.workspace = true
tt-vector.workspace = true
tt-colour.workspace = true
tt-anim.workspace = true
tt-fx.workspace = true

[lints]
workspace = true

# C0.3 rasteriser spike only (examples/c03_raster); dev-dependencies never reach the product or headless graphs.
[dev-dependencies]
# `Level::fallback()` (scalar, no platform SIMD) needs this feature of vello_cpu's SIMD crate.
fearless_simd = { version = "0.7", features = ["force_support_fallback"] }
png = "0.18.1"
serde_json.workspace = true
sha2.workspace = true
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline", "multithreading"] }
